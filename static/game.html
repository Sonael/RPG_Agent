<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Agent — Sessão</title>

  <!-- PWA: instalável no Android e iOS -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2b303a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RPG Agent">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
  <link rel="icon"
    type="image/png" href="/static/icons/favicon-32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <!-- DOMPurify: sanitiza o HTML gerado pelo marked antes de ir ao DOM.
       Sem isso, a narração da IA (ou texto injetado) poderia conter
       <script>/<img onerror> e executar — XSS. -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css?v=100">
  <!-- Chegou virando a página (utils.js, virarParaOutraPagina): a capa não
       abre de novo. Aqui no <head>, antes de a capa começar a animar. -->
  <script>
    try {
      if (sessionStorage.getItem('rpg_chegou_virando')) {
        document.documentElement.classList.add('chegou-virando');
        sessionStorage.removeItem('rpg_chegou_virando');
      }
    } catch (e) {}
  </script>
</head>

<body class="game-page">

  <div class="scene">
    <div class="tome">
      <div class="tome-cover animate-open">
        <h1 id="cover-title">Aventura</h1>
        <p>Carregando as suas crônicas...</p>
      </div>

      <div class="tome-spine"></div>
      <div class="bookmark"></div>

      <div id="sidebar-overlay" onclick="toggleSidebar(true)"></div>

      <aside id="sidebar" class="page-left" aria-label="Painel da campanha">
        <!-- Puxador e botão de fechar: no mobile a barra abre como folha
             inferior (pelo "Mais" da barra de baixo). -->
        <div class="sidebar-grab" aria-hidden="true"></div>
        <button class="sidebar-close" onclick="toggleSidebar(true)"
                aria-label="Fechar o painel">✕</button>
        <div class="sidebar-header">
          <div class="sb-topo">
            <h2 id="sb-campaign" class="book-title">—</h2>
            <!-- No desktop a barra recolhe numa coluna de ícones. -->
            <button id="sb-recolher" class="sb-recolher" type="button"
                    onclick="window.Barra && window.Barra.alternar()"
                    aria-label="Recolher a barra" aria-expanded="true" title="Recolher a barra"></button>
          </div>
        </div>

        <div class="sidebar-content">
          <!-- De relance, sem rolagem: onde, quem, o que fazer. Preenchido por
               barra.js a partir do motor. -->
          <section id="sb-relance" class="sb-relance" aria-label="De relance">
            <div class="sb-onde">
              <button id="sb-location" class="sb-onde-item sb-onde-local" type="button"
                      onclick="window.Locais && window.Locais._abrir('')" title="Ver o local">
                <span id="sb-icone-local" class="sb-onde-icone"></span><span id="sb-location-nome">—</span></button>
              <button id="ws-chapter" class="sb-onde-item" type="button"
                      onclick="window.Diario && window.Diario._abrir()" title="Ler este capítulo no diário">
                <span id="sb-icone-capitulo" class="sb-onde-icone"></span>Cap. <span id="ws-chapter-num">1</span></button>
              <button id="sb-tempo" class="sb-onde-item hidden" type="button"
                      onclick="window.Barra && window.Barra.abrir('grupo')" title="Hora do mundo: veja quem pode descansar">
                <span id="sb-icone-hora" class="sb-onde-icone"></span><span id="sb-tempo-texto">—</span></button>
            </div>
            <div id="sb-herois" class="sb-herois" aria-label="O grupo"></div>
            <button id="sb-missao" class="sb-missao hidden" type="button"
                    onclick="window.Barra && window.Barra.abrirMissao()"></button>
            <button id="sb-encontro" class="sb-missao sb-encontro hidden" type="button"
                    onclick="window.Barra && window.Barra.abrirEncontro()"></button>
            <div id="sb-avisos" class="sb-avisos hidden" aria-live="polite"></div>
          </section>

          <nav id="sb-atalhos" class="sb-atalhos" aria-label="Telas"></nav>
        </div>
        <div class="page-number left">14</div>
      </aside>

      <main id="chat-area" class="page-right">

        <div id="mobile-header">
          <div id="mobile-title">RPG Agent</div>
          <button class="settings-trigger-btn" onclick="toggleSettingsPanel()" aria-label="Configurações">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" class="pena-icon">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l-.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>

        <!-- Celular: local, hora e a vida do grupo; tocar abre o painel. -->
        <button id="faixa-relance" class="faixa-relance" type="button"
                onclick="toggleSidebar()" aria-label="Abrir o painel da campanha"></button>

        <div id="turn-tracker" class="hidden">
          <div id="turn-tracker-inner">
            <div id="tt-round-label"><span id="tt-round">Rodada 1</span></div>
            <div id="tt-cards"></div>
          </div>
        </div>

        <div id="chat-history"></div>

        <div id="input-area">
          <div style="position:relative;">

            <div id="cmd-menu" class="hidden">
              <div class="cmd-menu-title">Comandos disponíveis:</div>
              <div id="cmd-menu-items"></div>
            </div>

            <div class="input-row">
              <button id="dice-tray-btn" title="Rolar dado (jogador)" aria-label="Rolar dado" onclick="toggleDiceTray()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg></button>
              <textarea id="chat-input" placeholder="O que fará a seguir? (/ para comandos)"
                onkeydown="handleKey(event)" oninput="onInputChange(this)"></textarea>
              <button id="send-btn" onclick="sendMessage()">Enviar</button>
            </div>

            <div id="dice-tray" class="hidden bandeja-dados">
              <div class="linha-secao linha-secao-larga">
                <span
                  style="font-family: 'Playfair Display', serif; font-size:16px; font-weight:600; color:var(--text-main);">Rolar um dado</span>
                <div class="bandeja-linha">
                  <label
                    style="font-family: 'Lora', serif; font-size:12px; font-weight: 600; color:var(--text-muted);">Modificador:</label>
                  <input type="number" id="dice-modifier" value="0">
                </div>
              </div>
              <div class="bandeja-botoes">
                <button class="clean-button btn-inline-medio"
                  onclick="rollPlayerDie(4)">d4</button>
                <button class="clean-button btn-inline-medio"
                  onclick="rollPlayerDie(6)">d6</button>
                <button class="clean-button btn-inline-medio"
                  onclick="rollPlayerDie(8)">d8</button>
                <button class="clean-button btn-inline-medio"
                  onclick="rollPlayerDie(10)">d10</button>
                <button class="clean-button btn-inline-medio"
                  onclick="rollPlayerDie(12)">d12</button>
                <button class="clean-button btn-inline-medio destaque"
                  onclick="rollPlayerDie(20)">d20</button>
                <button class="clean-button btn-inline-medio"
                  onclick="rollPlayerDie(100)">d%</button>
              </div>
              <!-- O dado rola no próprio clique; sem esta linha não havia
                   nada indicando isso, e o jogador procurava um botão "Rolar". -->
              <div class="bandeja-nota">
                Clique num dado para rolar — o resultado vai direto para o Mestre.
              </div>
            </div>

          </div>
          <!-- Duas dicas: a de teclado não faz sentido num celular, onde o
               Enter do teclado virtual normalmente insere quebra de linha. -->
          <div class="composer-dica composer-dica-desktop">
            / comandos · Enter para enviar · Shift+Enter para nova linha</div>
          <div class="composer-dica composer-dica-toque">
            Digite / para ver os comandos</div>
        </div>

        <!-- Celular: as telas mais usadas a um toque. -->
        <nav id="barra-inferior" class="barra-inferior" aria-label="Telas"></nav>

        <div class="page-number right">15</div>
      </main>
    </div>
  </div>

  <div id="dialog-overlay" class="hidden">
    <div class="dialog-box" id="dialog-box">
      <div id="dialog-accent"
        style="height: 4px; border-radius: 8px 8px 0 0; position: absolute; top: 0; left: 0; right: 0;"></div>

      <div id="dialog-inner">
        <div id="dialog-head" class="modal-header dialogo-cabeca">
          <div id="dialog-icon"
            style="position: absolute; left: 0; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold;">
          </div>
          <div class="modal-title dialogo-titulo" id="dialog-title"></div>
        </div>

        <div id="dialog-message" class="dialogo-mensagem">
        </div>
      </div>

      <div id="dialog-buttons" class="acoes-centro"></div>
    </div>
  </div>

  <div id="edit-overlay" class="moldura-tela hidden">
    <div class="edit-box">
      <div class="modal-header">
        <div>
          <div id="edit-type" class="modal-subtitle">Editando</div>
          <div id="edit-name" class="modal-title">—</div>
        </div>
        <button onclick="closeEditModal()" class="close-btn">✕</button>
      </div>
      <div id="edit-body" class="scroll-area"></div>
      <div id="edit-footer">
        <!-- Destrutivo com MENOS peso que "Salvar", não igual: sem borda e em
             texto, para não competir com a ação que o jogador quase sempre
             quer. A confirmação é que segura o erro, não o tamanho do botão. -->
        <button id="edit-del-btn" class="btn-delete-discreto"
          onclick="deleteCurrentItem()">Deletar registro</button>
        <div class="acoes-par">
          <button class="clean-button btn-inline" onclick="closeEditModal()">Cancelar</button>
          <button class="btn-main btn-salvar-item"
            onclick="saveCurrentItem()">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/utils.js?v=26"></script>
  <script src="/static/js/game.js?v=50"></script>
  <script src="/static/js/combat.js?v=24"></script>
  <script src="/static/js/shop.js?v=18"></script>
  <script src="/static/js/levelup.js?v=14"></script>
  <script src="/static/js/rest.js?v=14"></script>
  <script src="/static/js/grimoire.js?v=13"></script>
  <script src="/static/js/inventory.js?v=4"></script>
  <script src="/static/js/locais.js?v=8"></script>
  <script src="/static/js/personagens.js?v=14"></script>
  <script src="/static/js/herois.js?v=4"></script>
  <script src="/static/js/loot.js?v=9"></script>
  <script src="/static/js/missoes.js?v=2"></script>
  <script src="/static/js/mapa.js?v=5"></script>
  <script src="/static/js/grupo.js?v=2"></script>
  <script src="/static/js/diario.js?v=4"></script>
  <script src="/static/js/elenco.js?v=3"></script>
  <script src="/static/js/mundo.js?v=2"></script>
  <script src="/static/js/relacoes.js?v=7"></script>
  <script src="/static/js/barra.js?v=9"></script>

  <script>
    (function() {
      try {
        const s = JSON.parse(localStorage.getItem('rpg_session') || '{}');
        if (s.campaign) document.getElementById('cover-title').textContent = s.campaign;
      } catch (_) {}
    })();

    // Wrappers chamados pelos botões da sidebar
    // AGORA ELES FECHAM A SIDEBAR IMEDIATAMENTE!
    function customBackToMenu() { 
      toggleSidebar(true); 
      exitGame(false); 
    }
    function customLogout() { 
      toggleSidebar(true); 
      exitGame(true);  
    }

    function toggleSidebar(forceClose) {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');

      if (forceClose === true || (forceClose && forceClose.type === 'click')) {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
      } else {
        sidebar.classList.toggle('active');
        overlay.classList.toggle('active');
      }
    }

    async function exitGame(isLogout) {
      if (typeof waiting !== 'undefined' && waiting) {
        if (typeof showAlert === 'function') await showAlert('Aguarde', 'Espere a narração terminar antes de sair.', 'warning');
        else alert('Espere a narração terminar antes de sair.');
        return;
      }

      const title = isLogout ? 'Sair do Sistema' : 'Voltar ao Menu';
      const msg = isLogout ? 'Você será desconectado da sua conta.' : 'A sua jornada será salva automaticamente antes de sair.';
      const btnText = isLogout ? 'Sair' : 'Voltar';

      if (typeof showConfirm === 'function') {
        const ok = await showConfirm(title, msg, 'warning', btnText);
        if (!ok) return;
      } else {
        if (!confirm(title + '\n' + msg)) return;
      }

      // Sair da conta fecha o livro. Voltar ao menu é voltar uma página: a
      // folha vira depois que a sessão foi salva (virarParaOutraPagina, abaixo).
      const cover = isLogout ? document.querySelector('.tome-cover') : null;
      if (cover) {
        cover.classList.remove('animate-open');
        void cover.offsetWidth;
        cover.classList.add('animate-close');
      }

      try {
        if (typeof authFetch === 'function') {
          await authFetch('/api/session/end', { method: 'POST' });
        } else {
          const token = localStorage.getItem('rpg_access_token') || localStorage.getItem('access_token');
          await fetch('/api/session/end', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
          });
        }
      } catch (e) {
        console.error('Erro ao encerrar sessão no servidor:', e);
      }

      if (isLogout) {
        if (typeof clearTokens === 'function') {
          clearTokens();
        } else {
          localStorage.removeItem('rpg_access_token');
          localStorage.removeItem('rpg_refresh_token');
        }
        localStorage.removeItem('rpg_session');
      }

      if (!isLogout && typeof virarParaOutraPagina === 'function') {
        await virarParaOutraPagina('/menu.html', -1);
        return;
      }
      setTimeout(() => {
        window.location.href = isLogout ? '/login.html' : '/menu.html';
      }, cover ? 1100 : 0);
    }
  </script>
</body>

</html>
