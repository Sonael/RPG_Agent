[pytest]
testpaths = tests
python_files = test_*.py
# `pythonpath = .` põe a raiz do repositório no sys.path, para os testes
# importarem `app` sem depender de instalação nem de PYTHONPATH externo.
pythonpath = .
# tests/legacy/ guarda as duas suítes em formato de script (tests.py e
# tests_combat_fuzz.py). Nenhuma casa com `test_*.py`, então o pytest não as
# coleta — ele chega nelas pelas pontes em test_legacy_dnd.py e
# test_fuzz_invariants.py, que as rodam em subprocesso.
norecursedirs = .git __pycache__ .cache .pytest_cache campanhas static screenshots env rpg scripts
# A suíte levava ~17 minutos parada, e quase tudo era teste de tela: cada um
# carrega game.html num Chromium e espera a rede sossegar — cerca de 2 s de
# preparo e outro tanto de execução, por teste, que não dá para encurtar sem
# perder o que eles provam.
#
# `-n auto --dist loadfile` roda os ARQUIVOS em paralelo, cada um inteiro
# dentro de um worker. É o modo que preserva o que a suíte já assume: fixture
# de escopo de módulo (o servidor Flask de cada arquivo), ordem dentro do
# arquivo, e a porta de rede, que é escolhida livre por processo.
#
# 8 e não `auto`: cada worker carrega um Chromium e um Flask, e `auto` abre um
# por núcleo — numa máquina de 20 núcleos são 20 navegadores disputando 8 GB.
# Oito já encosta no limite do que a suíte tem de arquivo pesado.
#
# Para depurar um teste de tela, `-n 0` volta ao serial (desligar o plugin com
# `-p no:xdist` não serve: o `-n` daqui deixaria de ser entendido).
addopts = -q --strict-markers -n 8 --dist loadfile
