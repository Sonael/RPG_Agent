[pytest]
testpaths = tests
python_files = test_*.py
# `pythonpath = .` põe a raiz do repositório no sys.path, para os testes
# importarem `app` sem depender de instalação nem de PYTHONPATH externo.
pythonpath = .
# tests/legacy/ guarda as duas suítes em formato de script (tests.py e
# tests_combat_fuzz.py). Nenhuma casa com `test_*.py`, então o pytest não as
# coleta — ele chega nelas pelas pontes em test_legacy_dnd.py e
# test_fuzz_invariants.py, que as rodam em subprocesso.
norecursedirs = .git __pycache__ .cache .pytest_cache campanhas static screenshots env app scripts
addopts = -q --strict-markers
